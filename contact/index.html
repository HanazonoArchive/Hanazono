<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contact Agsoy, Jay Mark V.">
  <meta name="color-scheme" content="dark">
  <title>Contact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght,MONO@0,300..800,1;1,300..800,1&display=swap');
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <nav class="site-nav">
        <a href="../"><i class="fas fa-home"></i> Home</a>
        <a href="../about/"><i class="fas fa-user"></i> About</a>
        <a href="../projects/"><i class="fas fa-briefcase"></i> Projects</a>
        <a href="../certifications/"><i class="fas fa-certificate"></i> Certifications</a>
        <a href="../explorations/"><i class="fas fa-compass"></i> Explorations</a>
        <a href="../skills/"><i class="fas fa-code"></i> Skills</a>
        <a href="../contact/"><i class="fas fa-envelope"></i> Contact</a>
      </nav>
    </header>

    <main>
      <section class="section fade-in">
        <div class="section-head">
          <h2><i class="fas fa-envelope"></i> Contact</h2>
          <p class="section-subtitle">Reach out for collaboration or roles.</p>
        </div>
        <div class="contact-grid">
          <div class="contact-card fade-in-delay">
            <h3><i class="fas fa-paper-plane"></i> Send a message</h3>
            <form class="contact-form" id="contact-form">
              <label>
                <i class="fas fa-user"></i> Name
                <input type="text" name="name" id="form-name" required style="margin-left: 2%;">
              </label>
              <label>
                <i class="fas fa-at"></i> Email
                <input type="email" name="email" id="form-email" required>
              </label>
              <label class="label-no-icon">
                Message
                <textarea name="message" id="form-message" rows="5" required></textarea>
              </label>
              <div class="form-button-container">
                <button type="submit" class="button" id="submit-btn" style="font-weight: 500; font-size: 100%;">
                  <span id="btn-text">Send</span>
                </button>
              </div>
              <div id="form-status" class="form-status"></div>
            </form>
            <p class="helper">Powered by Formspree with rate limiting protection.</p>
          </div>
          <div class="contact-card fade-in-delay-2">
            <h3><i class="fas fa-phone"></i> Direct</h3>
            <p><i class="fas fa-envelope"></i> Email: <a href="mailto:jagsoy.sanhs@gmail.com">jagsoy.sanhs@gmail.com</a></p>
            <p><i class="fab fa-github"></i> GitHub: <a href="https://github.com/HanazonoArchive" target="_blank" rel="noopener noreferrer">HanazonoArchive</a></p>
            <div class="social-links">
              <a href="https://github.com/HanazonoArchive" title="GitHub" target="_blank" rel="noopener noreferrer"><i class="fab fa-github"></i></a>
              <a href="mailto:jagsoy.sanhs@gmail.com" title="Email"><i class="fas fa-envelope"></i></a>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-content">
        <span>Built with ❤️ by Hanazono</span>
        <span class="footer-meta">Last updated: <span id="last-updated"></span> | Views: <span id="view-count">0</span></span>
      </div>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script type="module" src="../assets/js/main.js"></script>
  <script type="module" src="../assets/js/contact-form.js"></script>
  <script type="module" src="../assets/js/firebase-stats.js"></script>
</body>
</html>
