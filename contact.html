      <section class="section">
        <div class="section-head">
          <h2>Contact</h2>
          <p class="section-subtitle">Reach out for collaboration or roles.</p>
        </div>
        <div class="contact-grid">
          <div class="contact-card">
            <h3>Send a message</h3>
            <form class="contact-form" action="https://formsubmit.co/jagsoy.sanhs@gmail.com" method="POST">
              <input type="hidden" name="_subject" value="Portfolio contact">
              <input type="hidden" name="_captcha" value="true">
              <label>
                Name
                <input type="text" name="name" required>
              </label>
              <label>
                Email
                <input type="email" name="_replyto" required>
              </label>
              <label>
                Message
                <textarea name="message" rows="5" required></textarea>
              </label>
              <button type="submit" class="button">Send</button>
            </form>
            <p class="helper">Powered by FormSubmit (free form-to-email).</p>
          </div>
          <div class="contact-card">
            <h3>Direct</h3>
            <p>Email: <a href="mailto:jagsoy.sanhs@gmail.com">jagsoy.sanhs@gmail.com</a></p>
            <p>GitHub: <a href="https://github.com/HanazonoArchive" target="_blank" rel="noopener noreferrer">HanazonoArchive</a></p>
          </div>
        </div>
      </section>
    </main>
