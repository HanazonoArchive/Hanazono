<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Skills of Agsoy, Jay Mark V.">
  <meta name="color-scheme" content="dark">
  <meta property="og:title" content="Skills — HanazonoArchive">
  <meta property="og:description" content="Languages, tools, and platforms in Agsoy, Jay Mark V.'s toolkit.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="HanazonoArchive">
  <meta name="twitter:card" content="summary">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 0C10 6 6 10 0 12C6 14 10 18 12 24C14 18 18 14 24 12C18 10 14 6 12 0Z' fill='%23ffb7c5' opacity='0.8'/%3E%3Ccircle cx='12' cy='12' r='2' fill='%23ff9eb5'/%3E%3C/svg%3E">
  <title>Skills — HanazonoArchive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Google+Sans+Code:ital,wght,MONO@0,300..800,1;1,300..800,1&display=swap');
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>

  <!-- Editor Header -->
  <header class="editor-header">
    <div class="title-bar">
      <span class="title-bar-icon">
        <svg viewBox="0 0 24 24" fill="#ffb7c5" width="16" height="16">
          <path d="M12 0C10 6 6 10 0 12C6 14 10 18 12 24C14 18 18 14 24 12C18 10 14 6 12 0Z" opacity="0.8"/>
          <circle cx="12" cy="12" r="2" fill="#ff9eb5"/>
        </svg>
      </span>
      <span class="title-bar-text">HanazonoArchive — Portfolio</span>
      <div class="profile-switcher" id="profile-switcher">
        <button type="button" class="profile-switcher-trigger" aria-haspopup="listbox" aria-expanded="false" aria-label="Switch profile">
          <span class="profile-switcher-value"></span>
          <svg class="profile-switcher-arrow" viewBox="0 0 8 6" width="8" height="6" aria-hidden="true"><path d="M1 1.5l3 3 3-3" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
        </button>
        <ul class="profile-switcher-menu" role="listbox" hidden></ul>
      </div>
    </div>
    <nav class="tab-bar" role="tablist">
      <a href="../" class="tab" role="tab">
        <i class="fas fa-home"></i>_home
      </a>
      <a href="../about/" class="tab" role="tab">
        <i class="fas fa-user"></i>_about
      </a>
      <a href="../projects/" class="tab" role="tab">
        <i class="fas fa-briefcase"></i>_projects
      </a>
      <a href="../certifications/" class="tab" role="tab">
        <i class="fas fa-certificate"></i>_certifications
      </a>
      <a href="../explorations/" class="tab" role="tab">
        <i class="fas fa-compass"></i>_explorations
      </a>
      <a href="../skills/" class="tab active" role="tab" aria-selected="true">
        <i class="fas fa-code"></i>_skills
      </a>
      <a href="../contact/" class="tab" role="tab">
        <i class="fas fa-envelope"></i>_contact
      </a>
    </nav>
  </header>

  <div class="page">
    <main>
      <section class="section fade-in">
        <div class="section-header">
          <span class="comment-line">// Skills &amp; Toolkit</span>
          <h2 class="section-title"><span class="prompt-inline">$</span> cat package.json</h2>
          <p class="section-subtitle">Languages, tools, and platforms I work with.</p>
        </div>

        <!-- Skills rendered as code block -->
        <div class="code-block-card">
          <div class="code-card-tab">
            <i class="fas fa-cube"></i>
            <span class="code-card-tab-filename">skills.js</span>
            <span class="code-card-tab-lang">JavaScript</span>
          </div>
          <div class="code-block-body">
            <div class="code-block-gutter" id="skills-gutter"></div>
            <div class="code-block-lines" id="skills-code-lines">
              <!-- Populated by JS -->
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Status Bar -->
  <footer class="status-bar">
    <div class="status-bar-left">
      <span class="status-bar-item"><i class="fas fa-code-branch"></i> main</span>
      <span class="status-bar-separator">|</span>
      <span class="status-bar-item">skills.js</span>
      <span class="status-bar-separator">|</span>
      <span class="status-bar-item">🌸</span>
    </div>
    <div class="status-bar-right">
      <span class="status-bar-item">Last updated: <span id="last-updated"></span></span>
      <span class="status-bar-separator">|</span>
      <span class="status-bar-item">Views: <span id="view-count">0</span></span>
      <span class="status-bar-separator">|</span>
      <span class="status-bar-item" id="visitor-clock"></span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="../assets/js/sakura.js"></script>
  <script type="module" src="../assets/js/main.js"></script>
  <script src="../assets/js/firebase-stats.js"></script>
</body>
</html>
