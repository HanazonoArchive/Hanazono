<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certification Details — Jay Mark V. Agsoy</title>
  <meta name="description" content="Verified technical certification and credential details for Jay Mark V. Agsoy.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/portfolio.css">
  <link rel="stylesheet" href="assets/css/project.css">
  <link rel="stylesheet" href="assets/css/credentials.css">
  <script>
    (function () {
      try {
        var s = sessionStorage.getItem('page_transition_state');
        if (s) {
          var state = JSON.parse(s);
          if (Date.now() - state.timestamp < 10000 && state.bg) {
            document.documentElement.style.backgroundColor = state.bg;
            document.documentElement.style.setProperty('--transition-incoming-bg', state.bg);
            document.documentElement.classList.add('transitioning');
          }
        }
      } catch (e) { }
    })();
  </script>
</head>

<body>

  <!-- Seamless Page Transition Overlay (Zero-gap curtain) -->
  <div id="page-transition-overlay" class="page-transition-overlay" aria-hidden="true"></div>

  <div class="container project-page" id="top">
    <div class="project-nav-bar">
      <a href="index.html#sec-certs" class="back-link">&larr; Back to timeline</a>
    </div>

    <div class="split-grid-project">
      <!-- Story Column -->
      <main class="story-col">
        <header class="project-header">
          <div class="project-kicker" id="cert-kicker">Certification</div>
          <h1 id="cert-title">Loading certification...</h1>
          <p class="project-summary" id="cert-summary">
            Fetching certification details...
          </p>
        </header>

        <!-- Certificate PDF Viewer (Controls Hidden) -->
        <div id="cert-pdf-container" class="cert-pdf-box"></div>

        <!-- Narrative Overview -->
        <div id="cert-story-content"></div>
      </main>

      <!-- Sticky Telemetry / Details Sidebar -->
      <aside class="sticky-sidebar">
        <!-- Credential Metadata -->
        <div class="info-card">
          <h3>Credential Details</h3>
          <div class="info-row">
            <span class="info-label">Issuer</span>
            <span class="info-val" id="cert-issuer">—</span>
          </div>
          <div class="info-row">
            <span class="info-label">Date Issued</span>
            <span class="info-val" id="cert-date">—</span>
          </div>
          <div class="info-row">
            <span class="info-label">Status</span>
            <span class="info-val" style="color: #34d399;">Verified</span>
          </div>
          <a href="#" target="_blank" rel="noopener" class="btn-github" id="btn-pdf" style="background: var(--sky-accent);">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
            View Official PDF
          </a>
        </div>

        <!-- Validated Skills / Tags -->
        <div class="info-card" id="cert-skills-card">
          <h3>Validated Skills</h3>
          <div class="tag-cluster" id="cert-tags" style="margin-top: 10px;">
            <!-- Populated by JS -->
          </div>
        </div>
      </aside>
    </div>

    <!-- Footer -->
    <footer class="page-footer">
      <p>&copy; 2026 Jay Mark V. Agsoy &bull; <a href="credentials.html" style="color: var(--text-muted); text-decoration: none;">Certifications</a></p>
      <p style="font-family: var(--font-mono); font-size: 12px;">
        <a href="#top">&uarr; Return to the top</a>
      </p>
    </footer>
  </div>

  <script type="module">
    import { initCredentialsPage } from './assets/js/credentials.js';
    initCredentialsPage();
  </script>
</body>

</html>
