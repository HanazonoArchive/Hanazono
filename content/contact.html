<div class="introduction_contact">
    <img id="march7_logo" src="assets/march7.png" alt="March 7">
    <h1>Contact Us</h1>

    <div class="contact-info">
        <h2>Get in Touch</h2>
        <p>If you have any questions, feel free to reach out to us!</p>
        <p><strong>Email:</strong> xxxxxx@gmail.com</p>
        <p><strong>Phone:</strong> +XX XXXX-XXX-XXXX</p>
        <p><strong>Address:</strong> XXXXXXXXXXXX</p>
    </div>

    <form action="" method="">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit">Send Message</button>
    </form>
</div>
