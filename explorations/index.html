<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explorations and side interests.">
  <meta name="color-scheme" content="dark">
  <meta property="og:title" content="Explorations — Hanazono">
  <meta property="og:description" content="Side interests and non-core work by Agsoy, Jay Mark V.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Hanazono">
  <meta name="twitter:card" content="summary">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 0C10 6 6 10 0 12C6 14 10 18 12 24C14 18 18 14 24 12C18 10 14 6 12 0Z' fill='%23ffb7c5' opacity='0.8'/%3E%3Ccircle cx='12' cy='12' r='2' fill='%23ff9eb5'/%3E%3C/svg%3E">
  <title>Explorations — Hanazono</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght,MONO@0,300..800,1;1,300..800,1&display=swap');
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>

  <!-- Editor Header -->
  <header class="editor-header">
    <div class="title-bar">
      <span class="title-bar-icon">
        <svg viewBox="0 0 24 24" fill="#ffb7c5" width="16" height="16">
          <path d="M12 0C10 6 6 10 0 12C6 14 10 18 12 24C14 18 18 14 24 12C18 10 14 6 12 0Z" opacity="0.8"/>
          <circle cx="12" cy="12" r="2" fill="#ff9eb5"/>
        </svg>
      </span>
      <span class="title-bar-text">HanazonoArchive — Portfolio</span>
    </div>
    <nav class="tab-bar" role="tablist">
      <a href="../" class="tab" role="tab">
        <i class="fas fa-home"></i>_home
      </a>
      <a href="../about/" class="tab" role="tab">
        <i class="fas fa-user"></i>_about
      </a>
      <a href="../projects/" class="tab" role="tab">
        <i class="fas fa-briefcase"></i>_projects
      </a>
      <a href="../certifications/" class="tab" role="tab">
        <i class="fas fa-certificate"></i>_certifications
      </a>
      <a href="../explorations/" class="tab active" role="tab" aria-selected="true">
        <i class="fas fa-compass"></i>_explorations
      </a>
      <a href="../skills/" class="tab" role="tab">
        <i class="fas fa-code"></i>_skills
      </a>
      <a href="../contact/" class="tab" role="tab">
        <i class="fas fa-envelope"></i>_contact
      </a>
    </nav>
  </header>

  <div class="page">
    <main>
      <section class="section fade-in">
        <div class="section-header">
          <span class="comment-line">// Explorations</span>
          <h2 class="section-title"><span class="prompt-inline">$</span> ls ./explorations/</h2>
          <p class="section-subtitle">Side quests, deep dives, and interests.</p>
        </div>
        <div class="card-grid" id="explorations-grid"></div>
      </section>
    </main>
  </div>

  <!-- Status Bar -->
  <footer class="status-bar">
    <div class="status-bar-left">
      <span class="status-bar-item"><i class="fas fa-code-branch"></i> main</span>
      <span class="status-bar-separator">|</span>
      <span class="status-bar-item">explorations/</span>
      <span class="status-bar-separator">|</span>
      <span class="status-bar-item">🌸</span>
    </div>
    <div class="status-bar-right">
      <span class="status-bar-item">Last updated: <span id="last-updated"></span></span>
      <span class="status-bar-separator">|</span>
      <span class="status-bar-item">Views: <span id="view-count">0</span></span>
      <span class="status-bar-separator">|</span>
      <span class="status-bar-item" id="visitor-clock"></span>
    </div>
  </footer>

  <!-- Modal -->
  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-overlay" data-modal-close></div>
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-tab">
        <span class="modal-tab-filename" id="modal-filename">file.ext</span>
        <button class="modal-tab-close" data-modal-close aria-label="Close modal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="modal-media" id="modal-media"></div>
        <div class="modal-content">
          <div class="modal-kicker" id="modal-kicker"></div>
          <h3 id="modal-title"></h3>
          <div class="modal-meta" id="modal-meta"></div>
          <div class="chip-list modal-chips" id="modal-chips"></div>
          <div class="modal-links" id="modal-links"></div>
          <div class="modal-markdown" id="modal-markdown"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Media Lightbox -->
  <div class="media-lightbox" id="media-lightbox" aria-hidden="true">
    <div class="media-lightbox-overlay" data-lightbox-close></div>
    <div class="media-lightbox-container">
      <button class="media-lightbox-close" data-lightbox-close aria-label="Close">&times;</button>
      <div class="media-lightbox-media" id="media-lightbox-media"></div>
      <div class="media-lightbox-caption" id="media-lightbox-caption"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script type="module" src="../assets/js/main.js"></script>
  <script src="../assets/js/firebase-stats.js"></script>
</body>
</html>
